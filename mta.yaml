_schema-version: 3.3.0
ID: capgrafana
version: 1.0.0-SNAPSHOT
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
modules:
  - name: capgrafana-srv
    type: java
    path: srv
    parameters:
      instances: 1
      buildpack: sap_java_buildpack_jakarta
    properties:
      SPRING_PROFILES_ACTIVE: cloud,sandbox
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests=true --batch-mode
      build-result: target/*-exec.jar
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: capgrafana-auth
      - name: capgrafana-db
      - name: capgrafana-destination

  - name: capgrafana-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm run build
    requires:
      - name: capgrafana-db

  - name: capgrafana
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: capgrafana-auth
      - name: capgrafana-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
          url: ${default-url}

  - name: capgrafana-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: capgrafana-auth
      - name: srv-api
      - name: capgrafana-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: resources
      requires:
        - name: capgrafanacapgrafana_authors
          artifacts:
            - capgrafana_authors.zip
          target-path: resources
        - name: capgrafanacapgrafana_books
          artifacts:
            - capgrafana_books.zip
          target-path: resources

  - name: capgrafanacapgrafana_authors
    type: html5
    path: app/capgrafana_authors
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: capgrafanacapgrafana_books
    type: html5
    path: app/capgrafana_books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: capgrafana-destinations
    type: com.sap.application.content
    requires:
      - name: capgrafana-auth
        parameters:
          service-key:
            name: capgrafana-auth-key
      - name: capgrafana-html5-repo-host
        parameters:
          service-key:
            name: capgrafana-html5-repo-host-key
      - name: srv-api
      - name: capgrafana-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: capgrafana-html5-repository
              ServiceInstanceName: capgrafana-html5-repo-host
              ServiceKeyName: capgrafana-html5-repo-host-key
              sap.cloud.service: capgrafana.service
            - Name: capgrafana-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: capgrafana-auth
              ServiceKeyName: capgrafana-auth-key
              sap.cloud.service: capgrafana.service

resources:
  - name: capgrafana-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: capgrafana-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: capgrafana-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: capgrafana-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api

  - name: capgrafana-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: capgrafana-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
